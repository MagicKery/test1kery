<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Watch multiple livestreams at the same time with our simple multistreaming program. View your favorite streams together in one convenient screen."/>    <meta name="keywords" content="multistreaming program, multistreaming software, stream to multiple platforms, live streaming software multiple platforms"/>
    <meta name="keywords" content="multistreaming program, watch multiple streams, watch streams at the same time, livestream viewer, multiple Twitch streams, multistream viewer"/>
    
    <title>TKdomain // MULTI-STREAM</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="imgs/multistream_512x.png">
    <link rel="stylesheet" href="css/multistream.css">
</head>
<body>

    <header id="commandHeader">
        <div class="brand-section">
            <span class="cyber-badge"></span>
            <div class="brand-title">
                <h1>TKdomain-MultiStream</h1>
                <span id="streamCount">0 STREAMS ACTIVE</span>
            </div>
        </div>

        <div class="controls-deck">
            <input type="text" class="input-box" id="streamUrlInput" placeholder="Paste YouTube/Twitch URL or iframe...">
            <button class="neo-btn" onclick="addStreamNode()">
                <span>＋ ADD STREAM</span>
            </button>
            <select id="gridModeSelector" onchange="updateGridMatrix()">
                <option value="auto">✨ AUTO MATRIX</option>
                <option value="1">1 COLUMN</option>
                <option value="2">2 COLUMNS</option>
                <option value="3">3 COLUMNS</option>
                <option value="4">4 COLUMNS</option>
            </select>
            <button class="neo-btn neo-btn-alt" onclick="toggleHeaderDeck()" title="Hide Command Deck">▲ HIDE DECK</button>
        </div>
    </header>

    <div class="grid-viewport">
        <div class="streams-grid" id="streamsGrid">
            <!-- Dynamically populated stream cards -->
        </div>
    </div>

    <footer>
        <p style="font-size: xx-small;">&copy; 2026 Watch Multistreaming with TKdomain. All rights reserved.</p>
        <button class="restore-deck-btn" id="restoreDeckBtn" onclick="toggleHeaderDeck()">[⚡RESTORE MENU]</button>
    </footer>

    <script>
        const streamsGrid = document.getElementById('streamsGrid');
        const streamUrlInput = document.getElementById('streamUrlInput');
        const gridModeSelector = document.getElementById('gridModeSelector');
        const commandHeader = document.getElementById('commandHeader');
        const restoreDeckBtn = document.getElementById('restoreDeckBtn');

        let streams = JSON.parse(localStorage.getItem('cyber_streams_v1') || '[]');
        let currentGridMode = localStorage.getItem('cyber_grid_v1') || 'auto';

        gridModeSelector.value = currentGridMode;

        function toggleHeaderDeck() {
            commandHeader.classList.toggle('collapsed');
            commandHeader.style.margin= 0;
            commandHeader.style.padding= 0;
            const isCollapsed = commandHeader.classList.contains('collapsed');
            restoreDeckBtn.style.display = isCollapsed ? 'block' : 'none';
        }

        function updateGridMatrix() {
            const mode = gridModeSelector.value;
            currentGridMode = mode;
            localStorage.setItem('cyber_grid_v1', mode);

            if (mode === 'auto') {
                streamsGrid.style.gridTemplateColumns = 'repeat(auto-fit, minmax(380px, 1fr))';
            } else {
                streamsGrid.style.gridTemplateColumns = `repeat(${mode}, minmax(0, 1fr))`;
            }
        }

        function parseStreamSource(input) {
            input = input.trim();

            if (input.startsWith('<iframe')) {
                const srcMatch = input.match(/src="([^"]+)"/);
                return srcMatch ? srcMatch[1] : input;
            }

            if (input.includes('youtube.com') || input.includes('youtu.be')) {
                let videoId = '';
                if (input.includes('youtu.be/')) {
                    videoId = input.split('youtu.be/')[1].split('?')[0];
                } else if (input.includes('watch?v=')) {
                    videoId = input.split('watch?v=').pop().split('&')[0];
                } else if (input.includes('live/')) {
                    videoId = input.split('live/')[1].split('?')[0];
                } else if (input.includes('embed/')) {
                    videoId = input.split('embed/')[1].split('?')[0];
                }
                if (videoId) {
                    const hostname = window.location.hostname || 'localhost';
                    const protocol = window.location.protocol || 'http:';
                    return `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&enablejsapi=1&origin=${protocol}//${hostname}`;
                }
            }

            if (input.includes('twitch.tv/')) {
                const channel = input.split('twitch.tv/')[1]?.split('/')[0];
                if (channel && channel !== 'directory' && channel !== 'p') {
                    const hostname = window.location.hostname || 'localhost';
                    return `https://player.twitch.tv/?channel=${channel}&parent=${hostname}&autoplay=true`;
                }
            }

            return input;
        }

        function escapeMarkup(str) {
            return str.replace(/[&<>"']/g, char => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
            }[char]));
        }

        function updateNodeCounter() {
            const count = streams.length;
            document.getElementById('streamCount').textContent = `${count} STREAM${count === 1 ? '' : 'S'} ACTIVE`;
        }

        function reloadNodeStream(index) {
            const iframe = document.getElementById(`node-frame-${index}`);
            if (iframe) iframe.src = iframe.src;
        }

        function fullscreenNodeStream(index) {
            const iframe = document.getElementById(`node-frame-${index}`);
            if (iframe?.requestFullscreen) {
                iframe.requestFullscreen();
            } else if (iframe?.webkitRequestFullscreen) {
                iframe.webkitRequestFullscreen();
            }
        }

        function renderStreamsMatrix() {
            streamsGrid.innerHTML = '';
            updateNodeCounter();

            if (streams.length === 0) {
                streamsGrid.innerHTML = `
                    <div class="empty-matrix">
                        <div class="empty-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" />
                            </svg>
                        </div>
                        <h3>CYBER-DECK STANDBY</h3>
                        <p>Input any YouTube live broadcast or Twitch stream URL above to initialize cyber-matrix nodes.</p>
                    </div>
                `;
                return;
            }

            streams.forEach((url, index) => {
                const card = document.createElement('div');
                card.className = 'stream-node-card';
                card.innerHTML = `
                    <div class="node-header">
                        <span class="node-id">NODE #0${index + 1}</span>
                        <div class="node-actions">
                            <button class="node-btn" onclick="reloadNodeStream(${index})" title="Reload Stream">↻</button>
                            <button class="node-btn" onclick="fullscreenNodeStream(${index})" title="Fullscreen Mode">⛶</button>
                            <button class="node-btn purge-btn" onclick="removeStreamNode(${index})" title="Purge Node">✕</button>
                        </div>
                    </div>
                    <div class="node-body">
                        <iframe id="node-frame-${index}" src="${escapeMarkup(url)}" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen="true" scrolling="no" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"></iframe>
                    </div>
                `;
                streamsGrid.appendChild(card);
            });
        }

        function addStreamNode() {
            const rawInput = streamUrlInput.value;
            if (!rawInput) return;

            const embedUrl = parseStreamSource(rawInput);
            if (!embedUrl || !/^https?:\/\//i.test(embedUrl)) {
                alert('Please enter a valid HTTP/HTTPS stream URL or iframe.');
                return;
            }

            if (streams.includes(embedUrl)) {
                alert('This stream node is already active in your matrix.');
                return;
            }

            streams.push(embedUrl);
            localStorage.setItem('cyber_streams_v1', JSON.stringify(streams));
            streamUrlInput.value = '';
            renderStreamsMatrix();
        }

        function removeStreamNode(index) {
            streams.splice(index, 1);
            localStorage.setItem('cyber_streams_v1', JSON.stringify(streams));
            renderStreamsMatrix();
        }

        // Initialize application grid & state
        updateGridMatrix();
        renderStreamsMatrix();

        streamUrlInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') addStreamNode();
        });

        document.addEventListener('keydown', function (e) {
            if (e.key === '/' && document.activeElement !== streamUrlInput) {
                e.preventDefault();
                streamUrlInput.focus();
            }
        });
    </script>
</body>
</html>
